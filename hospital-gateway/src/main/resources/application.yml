server:
  port: 8104

spring:
  application:
    name: hospital-gateway
  cloud:
    gateway:
      discovery:
        locator:
          enabled: false
      globalcors:
        cors-configurations:
          '[/**]':
            allowed-origin-patterns: "http://localhost:*"
            allowed-methods: "*"
            allowed-headers: "*"
            allow-credentials: true
      routes:
        - id: hospital-auth
          uri: http://${CORE_HOST:localhost}:8101
          predicates:
            - Path=/api/auth/**
        - id: hospital-core
          uri: http://${CORE_HOST:localhost}:8101
          predicates:
            - Path=/api/core/**
        - id: hospital-notification
          uri: http://${NOTIFICATION_HOST:localhost}:8102
          predicates:
            - Path=/api/notify/**
        # R-62: 原先此处有 id=hospital-file 的路由,直接把 /api/files/** 转发到 file-service(8103),
        # 并由网关 AddRequestHeader 注入内部令牌。现已整体撤除,原因:
        #  1) 网关默认 profile 即 permitAll(仓库中也不存在 application-iam.yml),
        #     而 AddRequestHeader 对匿名请求同样生效 —— 内部令牌对"经网关的匿名调用者"不构成边界;
        #  2) file-service 的 list 在不传 patientId 时返回全部对象及其 patientId,
        #     而 download 的归属校验恰好依赖这组对应关系 → 形成"匿名列举 + 下载"的闭环。
        # 现在文件访问一律经 core 的 /api/core/files(见 FileProxyController),
        # file-service 只在内网可达;内部令牌也只在 core ↔ file-service 之间存在。
        # 注意:不要为了"方便"再把这条路由加回来 —— 网关层没有身份上下文可用。
        - id: hospital-patient
          uri: http://${CORE_HOST:localhost}:8101
          predicates:
            - Path=/api/patient/**
        - id: hospital-pharmacy
          uri: http://${CORE_HOST:localhost}:8101
          predicates:
            - Path=/api/pharmacy/**
        - id: hospital-lab
          uri: http://${CORE_HOST:localhost}:8101
          predicates:
            - Path=/api/lab/**
        - id: hospital-exam
          uri: http://${CORE_HOST:localhost}:8101
          predicates:
            - Path=/api/core/exams/**
        - id: hospital-report
          uri: http://${CORE_HOST:localhost}:8101
          predicates:
            - Path=/api/reports/**
        - id: hospital-fhir
          uri: http://${CORE_HOST:localhost}:8101
          predicates:
            - Path=/fhir/**
        # Swagger UI & API 文档(转发到 core)
        - id: core-swagger-ui
          uri: http://${CORE_HOST:localhost}:8101
          predicates:
            - Path=/swagger-ui.html,/swagger-ui/**,/api-docs/**,/v3/api-docs/**

# R-62: 网关不再持有 file-service 的调用令牌 —— /api/files/** 路由已撤除,
# 令牌只在 core(FILE_INTERNAL_TOKEN)与 file-service 之间存在。

logging:
  # R-24: 由 debug 降为 info —— 网关是所有请求的入口,DEBUG 下每个请求都会打路由匹配日志,
  # 既拖慢转发又把完整 URL(可能含 token / 患者 ID)写进日志。排障时用
  # --logging.level.com.hospital=debug 临时打开。
  level:
    com.hospital: info
