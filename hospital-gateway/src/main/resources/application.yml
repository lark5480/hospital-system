server:
  port: 8104

spring:
  application:
    name: hospital-gateway
  cloud:
    gateway:
      discovery:
        locator:
          enabled: false
      globalcors:
        cors-configurations:
          '[/**]':
            allowed-origin-patterns: "http://localhost:*"
            allowed-methods: "*"
            allowed-headers: "*"
            allow-credentials: true
      routes:
        - id: hospital-auth
          uri: http://${CORE_HOST:localhost}:8101
          predicates:
            - Path=/api/auth/**
        - id: hospital-core
          uri: http://${CORE_HOST:localhost}:8101
          predicates:
            - Path=/api/core/**
        - id: hospital-notification
          uri: http://${NOTIFICATION_HOST:localhost}:8102
          predicates:
            - Path=/api/notify/**
        - id: hospital-file
          uri: http://${FILE_HOST:localhost}:8103
          predicates:
            - Path=/api/files/**
          filters:
            # R-03: 由网关代发内部调用令牌 —— 令牌只存在于服务端(网关 ↔ file-service),
            # 浏览器侧永远不接触,避免"前端直连就必须把令牌下发到浏览器"的死结。
            - AddRequestHeader=X-Internal-Token, ${file.internal-token}
        - id: hospital-patient
          uri: http://${CORE_HOST:localhost}:8101
          predicates:
            - Path=/api/patient/**
        - id: hospital-pharmacy
          uri: http://${CORE_HOST:localhost}:8101
          predicates:
            - Path=/api/pharmacy/**
        - id: hospital-lab
          uri: http://${CORE_HOST:localhost}:8101
          predicates:
            - Path=/api/lab/**
        - id: hospital-exam
          uri: http://${CORE_HOST:localhost}:8101
          predicates:
            - Path=/api/core/exams/**
        - id: hospital-report
          uri: http://${CORE_HOST:localhost}:8101
          predicates:
            - Path=/api/reports/**
        - id: hospital-fhir
          uri: http://${CORE_HOST:localhost}:8101
          predicates:
            - Path=/fhir/**
        # Swagger UI & API 文档(转发到 core)
        - id: core-swagger-ui
          uri: http://${CORE_HOST:localhost}:8101
          predicates:
            - Path=/swagger-ui.html,/swagger-ui/**,/api-docs/**,/v3/api-docs/**

# R-03: 调用 file-service 的内部调用令牌,须与 file-service 侧配置同一把。
# 生产必须通过环境变量 FILE_INTERNAL_TOKEN 注入;留空时 file-service 在 prod profile 下会拒绝启动。
file:
  internal-token: ${FILE_INTERNAL_TOKEN:}

logging:
  level:
    com.hospital: debug
