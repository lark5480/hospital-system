# 医院系统 · 本地中间件编排
# 前后端代码在本地 IDE 运行，中间件（PostgreSQL/Redis/MinIO/RabbitMQ）由本文件编排。
#
# ============ 常用命令速查（在本文件所在目录执行） ============
#
# 启动全部中间件（后台）：
#   docker compose up -d
#
# 查看容器状态 / 实时日志：
#   docker compose ps
#   docker compose logs -f postgres        # 单看某个服务日志，Ctrl+C 退出
#
# 停止但保留数据（下次 up 数据还在）：
#   docker compose stop                    # 仅停止
#   docker compose down                    # 停止并删除容器/网络（保留数据卷）
#
# 【重置数据库】停止并清空数据卷 → 重新拉起：
#   docker compose down -v                 # 删除容器 + pg-data / minio-data 数据卷
#   docker compose up -d                   # 全新 pg-data 会重跑 schema.sql 播种
#   注意：-v 会一并清空 MinIO 已上传文件；仅本项目卷，不影响其他容器。
#
# 只重启单个服务：
#   docker compose restart postgres
#
# 验证种子数据是否落库（重置后确认）：
#   docker exec hospital-postgres psql -U postgres -d hospital -c "SELECT code,name FROM org.department ORDER BY id;"
#   docker exec hospital-postgres psql -U postgres -d hospital -c "SELECT name,phone,position FROM org.staff ORDER BY phone;"
#
# ---- 中间件就绪后，启动应用（各占一个终端）----
#   mvn -pl hospital-core spring-boot:run                 # :8101（首启会创建统一账号，默认密码 123456）
#   mvn -pl hospital-notification-service spring-boot:run # :8102
#   mvn -pl hospital-file-service spring-boot:run         # :8103
#   mvn -pl hospital-gateway spring-boot:run              # :8104
#   cd hospital-web && npm run dev                        # :5173（Vite 代理到网关）
# =============================================================
#
# 【R-36 安全说明】以下口令都是**本地开发演示默认值**,通过环境变量可覆盖:
#   PG_PASSWORD / MINIO_ACCESS_KEY / MINIO_SECRET_KEY / RABBIT_PASSWORD / REDIS_PASSWORD
# 生产环境务必用 .env(参考 .env.example)覆盖,并注意:
#   1) 所有中间件端口已绑定 127.0.0.1,只允许本机访问,不对局域网/公网暴露。
#      原先直接映射 "5432:5432" 会让内网任何人用默认口令连上 PostgreSQL,
#      读到 patient.patient 的身份证明文、以及 MinIO 里的全部报告文件。
#   2) Redis 未启用密码(requirepass)。因端口已收回环,本机开发可接受;
#      若确需跨机访问,请自行加 requirepass 并同步 core 的 spring.data.redis.password。
#   3) 本文件仅用于本地开发;生产部署请勿直接使用这些默认口令。
# =============================================================

services:
  postgres:
    image: postgres:16
    container_name: hospital-postgres
    environment:
      POSTGRES_USER: ${PG_USER:-postgres}
      POSTGRES_PASSWORD: ${PG_PASSWORD:-root123}
      POSTGRES_DB: ${PG_DB:-hospital}
    ports:
      # R-36: 绑定回环,禁止内网直连
      - "127.0.0.1:5432:5432"
    volumes:
      - pg-data:/var/lib/postgresql/data
      - ./hospital-core/src/main/resources/db/schema.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${PG_USER:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7
    container_name: hospital-redis
    ports:
      # R-36: 绑定回环;Redis 无密码,绝不能对外暴露
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:latest
    container_name: hospital-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-minioadmin}
    ports:
      # R-36: 绑定回环 —— MinIO Console(9001) 用默认口令可浏览/下载全部报告文件
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5

  rabbitmq:
    image: rabbitmq:3-management
    container_name: hospital-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBIT_USER:-admin}
      RABBITMQ_DEFAULT_PASS: ${RABBIT_PASSWORD:-admin123}
    ports:
      # R-36: 绑定回环 —— RabbitMQ 管理端(15672)可读到含患者姓名的消息体
      - "127.0.0.1:5672:5672"
      - "127.0.0.1:15672:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  pg-data:
  minio-data:
