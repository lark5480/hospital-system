server:
  port: 8101
  error:
    include-message: always

spring:
  application:
    name: hospital-core
  datasource:
    url: jdbc:postgresql://${PG_HOST:localhost}:${PG_PORT:5432}/${PG_DB:hospital}
    username: ${PG_USER:postgres}
    password: ${PG_PASSWORD:root123}
    driver-class-name: org.postgresql.Driver
  rabbitmq:
    host: ${RABBIT_HOST:localhost}
    port: ${RABBIT_PORT:5672}
    username: ${RABBIT_USER:admin}
    password: ${RABBIT_PASSWORD:admin123}
  sql:
    init:
      mode: always
      schema-locations: classpath:db/schema.sql
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    db-config:
      id-type: auto

logging:
  # 控制台日志字符集:默认 UTF-8(Linux/CI 正确)。Windows 控制台若为 GBK 出现乱码,
  # 可 chcp 65001 让控制台切到 UTF-8,或设环境变量 CONSOLE_LOG_CHARSET=GBK 让日志按 GBK 输出
  charset:
    console: ${CONSOLE_LOG_CHARSET:UTF-8}
  level:
    com.hospital: debug

# 内部文件服务(core → file-service → MinIO)地址;默认 8103 与运行实例一致
file:
  service:
    base-url: http://localhost:8103

# SpringDoc OpenAPI (Swagger UI)
springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: alpha
